name: Probe Bulbapedia access
on: { workflow_dispatch: {} }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Try the API with different request styles
        run: |
          U='https://bulbapedia.bulbagarden.net/w/api.php?action=query&titles=Bill%20(Base%20Set%2091)&prop=revisions&rvprop=content&rvslots=main&format=json'
          for ua in "TCGMarketplaceData/1.0 (risingmediajp@gmail.com)" "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36" "curl/8.5"; do
            code=$(curl -s -o /tmp/b.txt -w '%{http_code}' -A "$ua" "$U"); echo "UA [$ua] -> $code"; head -c 200 /tmp/b.txt; echo
          done
          echo "--- archives (image host):"; curl -s -o /dev/null -w '%{http_code}\n' -A "TCGMarketplaceData/1.0" https://archives.bulbagarden.net/media/upload/e/ed/SV6_Logo_JP.png
