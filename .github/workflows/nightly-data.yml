name: Nightly data build

on:
  schedule:
    - cron: '30 12 * * *'   # 12:30 UTC — TCGdex prices refresh ~10:30 UTC
  workflow_dispatch:
  # Changes to the pipeline itself rebuild immediately (the bot's own cache commits don't trigger runs).
  push:
    branches: [main]
    paths: ['data-pipeline/*.mjs', 'data-pipeline/config.json', 'tools/**', 'package.json', '.github/workflows/**']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: nightly-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    # Bulbapedia answers GitHub runners with 403; the name/art/logo tools go through our VPS proxy
    # (tools/bulba-proxy.mjs) when these secrets are set.
    env:
      BULBA_PROXY: ${{ secrets.BULBA_PROXY }}
      BULBA_KEY: ${{ secrets.BULBA_KEY }}
      # onnxruntime-node's postinstall downloads a 300 MB CUDA package from nuget.org that the CPU
      # embeddings never use; that download timing out failed run #32. Skip it.
      ONNXRUNTIME_NODE_INSTALL: skip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # Any validation failure exits non-zero: nothing is deployed and the last good files stay live.
      - name: Build indexes + home.json
        run: node data-pipeline/build.mjs
      # TCGplayer prices + pictures for Japanese cards, and the Japanese sets TCGdex lists without cards
      # (tcgcsv.com, once a day, only when it has changed). Rewrites index-ja.json (filled sets, English names).
      - name: TCGplayer Japan prices, pictures and empty sets
        run: node tools/jp-prices.mjs
      - name: TCGplayer pictures for English cards without one
        run: node tools/en-images.mjs
      # Logos TCGdex lacks: English logo for other-language sets, Bulbapedia for Japanese sets by their
      # English name from TCGplayer (cached).
      - name: Fill missing set logos
        run: node tools/fill-logos.mjs

      # Raw card-art fingerprints (~90 MB): Actions cache first, else the single-commit embed-cache branch.
      # Without them a run would re-download ~33k images from a slow host (hours).
      - uses: actions/cache@v4
        id: embedcache
        with:
          path: data-pipeline/cache/embed
          key: embed-${{ github.run_id }}
          restore-keys: embed-
      # (git checkout <branch> -- path also STAGES the files; the reset keeps them out of main's commits.)
      - name: Seed fingerprints from the embed-cache branch
        if: steps.embedcache.outputs.cache-matched-key == ''
        run: |
          git fetch --depth 1 origin embed-cache && git checkout FETCH_HEAD -- data-pipeline/cache/embed && git reset -q -- data-pipeline/cache/embed || echo "no embed-cache branch yet"
      - name: Fingerprint before
        id: before
        run: echo "sum=$(cat data-pipeline/cache/embed/*.json 2>/dev/null | sha1sum | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Recognition model
        run: |
          mkdir -p tools/models
          node -e "const c=require('./data-pipeline/config.json').recognition; console.log(c.model + ' ' + c.modelUrl)" | {
            read file url; [ -f "tools/models/$file" ] || curl -sSL --retry 3 -o "tools/models/$file" "$url"; }

      # Incremental: only new cards are fingerprinted (official Japanese images fetched politely, memory only).
      - name: Build recognition gallery
        run: |
          node tools/recog/official-ja.mjs
          node tools/recog/build-embeddings.mjs
          node tools/recog/build-twins.mjs
          node tools/recog/build-art-twins.mjs

      # English card thumbnails (300 px, ~380 MB, ~20 KB each) served from Pages: Actions cache, else the
      # single-commit thumbs-cache branch. Only new cards are downloaded (max 8000 per run).
      - uses: actions/cache@v4
        id: thumbcache
        with:
          path: data-pipeline/cache/thumbs
          key: thumbs300-${{ github.run_id }}
          restore-keys: thumbs300-
      # Always union with the branch (never trust either copy alone): files on the branch that the Actions
      # cache lacks are added, nothing is removed.
      - name: Seed thumbnails from the thumbs-cache branch
        run: |
          if git fetch --depth 1 origin thumbs-cache; then
            git ls-tree -r --name-only FETCH_HEAD | grep '^data-pipeline/cache/thumbs/' | while read -r f; do
              [ -f "$f" ] || git checkout FETCH_HEAD -- "$f"
            done
            git reset -q -- data-pipeline/cache/thumbs
          else echo "no thumbs-cache branch yet"; fi
      - name: Bake card thumbnails
        id: thumbs
        run: |
          before=$(find data-pipeline/cache/thumbs -type f 2>/dev/null | wc -l)
          node tools/fill-ja-art.mjs
          node tools/ja-names.mjs
          node tools/ja-official-names.mjs
          node tools/bake-card-thumbs.mjs
          after=$(find data-pipeline/cache/thumbs -type f | wc -l)
          echo "changed=$([ "$before" != "$after" ] && echo 1 || echo 0)" >> "$GITHUB_OUTPUT"
      - name: Update thumbs-cache branch
        if: steps.thumbs.outputs.changed == '1'
        run: |
          # Never replace the branch with a smaller set (a partial cache must not erase good pictures).
          have=$(find data-pipeline/cache/thumbs -type f -name '*.webp' | wc -l)
          onbranch=$(git ls-tree -r --name-only FETCH_HEAD 2>/dev/null | grep -c '^data-pipeline/cache/thumbs/.*webp$' || true)
          if [ "$have" -lt "${onbranch:-0}" ]; then echo "local $have < branch $onbranch — not pushing"; exit 0; fi
          tmp=$(mktemp -d) && mkdir -p "$tmp/data-pipeline/cache" && cp -r data-pipeline/cache/thumbs "$tmp/data-pipeline/cache/" && cd "$tmp"
          git init -q && git checkout -q -b thumbs-cache
          git add . && git -c user.name=data-bot -c user.email=data-bot@users.noreply.github.com commit -qm "thumbs cache"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" thumbs-cache

      - name: Commit refreshed set cache
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data-pipeline/cache/en data-pipeline/cache/ja data-pipeline/cache/fr data-pipeline/cache/de data-pipeline/cache/es data-pipeline/cache/it data-pipeline/cache/pt data-pipeline/cache/logos data-pipeline/cache/tcgcsv-ja.json data-pipeline/cache/tcgcsv-en.json data-pipeline/cache/bulba-logos.json data-pipeline/cache/ja-art
          if ! git diff --cached --quiet; then git commit -m "data: refresh cache" && git push; fi

      # New fingerprints → replace the embed-cache branch with one fresh commit (no history growth).
      - name: Update embed-cache branch
        run: |
          after=$(cat data-pipeline/cache/embed/*.json | sha1sum | cut -c1-12)
          if [ "$after" != "${{ steps.before.outputs.sum }}" ]; then
            tmp=$(mktemp -d) && cp -r data-pipeline/cache/embed "$tmp/" && cd "$tmp"
            git init -q && git checkout -q -b embed-cache
            mkdir -p data-pipeline/cache && mv embed data-pipeline/cache/
            git add . && git -c user.name=data-bot -c user.email=data-bot@users.noreply.github.com commit -qm "embed cache"
            git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" embed-cache
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: data-pipeline/dist
      # GitHub Pages returns the odd 502 / "no artifact" at deploy time (runs #20, #33) after a good
      # build: try once more before failing the run.
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
